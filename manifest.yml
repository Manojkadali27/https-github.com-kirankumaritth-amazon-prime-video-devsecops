apiVersion: apps/v1
kind: Deployment
metadata:
  name: primevideo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: primevideo
  template:
    metadata:
      labels:
        app: primevideo
    spec:
      containers:
        - name: primevideo
          image: supersection/primevideo:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: primevideo-service
spec:
  type: LoadBalancer
  selector:
    app: primevideo
  ports:
    - port: 80
      targetPort: 3000
